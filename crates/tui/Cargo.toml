[package]
name = "minimap-tui"
description = "Terminal renderer for the minimap codebase map"
edition.workspace = true
license.workspace = true
version.workspace = true

[[bin]]
name = "minimap"
path = "src/main.rs"

[dependencies]
anyhow = "1"
arboard = { version = "3.6.1", default-features = false }
clap = { version = "4", features = ["derive"] }
minimap-core = { path = "../core" }
ratatui = "0.30"
serde_json = "1"
syntect = { version = "5.3", default-features = false, features = ["parsing", "plist-load", "regex-fancy"] }
unicode-width = "0.2"

[dev-dependencies]
insta = "1"
tempfile = "3"
