[package]
name = "minimap-core"
description = "Index and layout for the minimap codebase map"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
anyhow = "1"
gix = { version = "0.87", default-features = false, features = ["dirwalk", "index", "sha1"] }
globset = "0.4"
notify = "8.2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "3.2"
syntect = { version = "5.3", default-features = false, features = ["parsing", "plist-load", "regex-fancy"] }
toml = "1"
tree-sitter = "0.27"
tree-sitter-clojure-orchard = "0.2"
two-face = { version = "0.5.2", default-features = false, features = ["syntect-fancy"] }

[dev-dependencies]
insta = "1"
tempfile = "3"
